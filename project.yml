name: LiveTimerConnect

options:
  bundleIdPrefix: com.kingyorkson
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  LiveTimerConnect:
    type: application
    platform: iOS
    sources:
      - path: LiveTimerConnect
        excludes:
          - "Info.plist"
          - "LiveTimerConnect.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kingyorkson.LiveTimerConnect
        PRODUCT_NAME: LiveTimerConnect
        INFOPLIST_FILE: LiveTimerConnect/Info.plist
        CODE_SIGN_ENTITLEMENTS: LiveTimerConnect/LiveTimerConnect.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - target: LiveTimerConnectWidget
        embed: true
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework

  LiveTimerConnectWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveTimerConnectWidget
        excludes:
          - "Info.plist"
          - "LiveTimerConnectWidget.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kingyorkson.LiveTimerConnect.Widget
        PRODUCT_NAME: LiveTimerConnectWidget
        INFOPLIST_FILE: LiveTimerConnectWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: LiveTimerConnectWidget/LiveTimerConnectWidget.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework

schemes:
  LiveTimerConnect:
    build:
      targets:
        LiveTimerConnect: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
